version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: apix_postgres
    environment:
      POSTGRES_DB: apix
      POSTGRES_USER: apix
      POSTGRES_PASSWORD: apix_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apix -d apix"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apix_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://apix:apix_secret_password@postgres:5432/apix
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: apix_dashboard
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apix_scraper
    command: python scrapers/run_daily.py
    environment:
      DATABASE_URL: postgresql://apix:apix_secret_password@postgres:5432/apix
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data

volumes:
  postgres_data:
