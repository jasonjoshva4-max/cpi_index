name: APIx CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build, Lint & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install system dependencies for Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx fastapi uvicorn sqlalchemy ruff playwright numpy pandas requests

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium

      - name: Seed Reference Data
        run: |
          python apix/db/seed.py
          python apix/db/seed_events_macro.py
          python apix/db/seed_dgca_ref.py

      - name: Run Ruff Linter
        run: |
          ruff check . --select E,F,W --ignore E501

      - name: Execute Pytest Suite
        run: |
          python -m pytest
